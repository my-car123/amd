<!DOCTYPE html>
<html>
<head>
    <title>اختبار دخول Firebase</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js"
            }
        }
    </script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>اختبار تسجيل الدخول</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني" style="width:100%; margin:8px 0; padding:8px;">
    <input type="password" id="password" placeholder="كلمة المرور" style="width:100%; margin:8px 0; padding:8px;">
    <button id="loginBtn" style="padding:10px 20px;">دخول</button>
    <pre id="result" style="margin-top:20px; background:#f4f4f4; padding:10px;"></pre>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithEmailAndPassword } from "firebase/auth";

        const firebaseConfig = {
            apiKey: "AIzaSyDBHHGY_gVpm3NlXThqsC6ojTL9Je4xQ9w",
            authDomain: "car-moving-8b59e.firebaseapp.com",
            databaseURL: "https://car-moving-8b59e-default-rtdb.firebaseio.com",
            projectId: "car-moving-8b59e",
            storageBucket: "car-moving-8b59e.firebasestorage.app",
            messagingSenderId: "332747318494",
            appId: "1:332747318494:web:d5d61cd53f322a182f0e4f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const resultDiv = document.getElementById('result');

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            resultDiv.textContent = 'جاري المحاولة...';
            try {
                const userCred = await signInWithEmailAndPassword(auth, email, password);
                resultDiv.textContent = `✅ نجحت! تم تسجيل الدخول كـ: ${userCred.user.email}`;
            } catch (error) {
                resultDiv.textContent = `❌ فشل: ${error.code} - ${error.message}`;
            }
        });
    </script>
</body>
</html>
