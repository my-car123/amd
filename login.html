<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الأسطول - دخول</title>
    <link rel="stylesheet" href="fleet-style.css">
    <link rel="stylesheet" href="fleet-components.css">
</head>
<body>

    <header class="system-header">
        <div class="header-container">
            <div class="logo-wrapper">
                <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
            </div>
            <div class="header-actions">
                <div class="clock" id="loginClock">جاري التحميل...</div>
                <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">English</button>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 class="auth-title" id="loginTitle">بوابة إدارة الأسطول</h2>
            <div id="errorContainer" class="error-container hidden"><p id="errorText"></p></div>
            <form id="loginForm">
                <div class="form-group">
                    <label id="emailLabel">البريد الإلكتروني *</label>
                    <input type="email" id="loginEmail" required placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label id="passLabel">كلمة المرور *</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" id="loginBtn" class="btn-navy">تسجيل الدخول</button>
            </form>
        </div>
    </div>

    <footer class="system-footer">
        <span>mohamed saad © 2026</span>
    </footer>

    <script type="module" src="fleet-firebase.js"></script>
    <script src="fleet-logger.js"></script>
    <script src="fleet-auth.js"></script>

    <script>
        const texts = {
            ar: { title: "بوابة إدارة الأسطول", email: "البريد الإلكتروني *", password: "كلمة المرور *", login: "تسجيل الدخول", lang: "English" },
            en: { title: "Fleet Management Portal", email: "Email Address *", password: "Password *", login: "Login", lang: "العربية" }
        };
        function applyLanguage(lang) {
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            const t = texts[lang];
            document.getElementById('loginTitle').textContent = t.title;
            document.getElementById('emailLabel').textContent = t.email;
            document.getElementById('passLabel').textContent = t.password;
            document.getElementById('loginBtn').textContent = t.login;
            document.getElementById('langBtn').textContent = t.lang;
        }
        function toggleLanguage() {
            const current = localStorage.getItem('lang') || 'ar';
            const next = current === 'ar' ? 'en' : 'ar';
            localStorage.setItem('lang', next);
            applyLanguage(next);
            updateClock();
        }
        function updateClock() {
            const clock = document.getElementById('loginClock');
            if (clock && window.Logger) {
                const time = window.Logger.getUAETime();
                const lang = localStorage.getItem('lang') || 'ar';
                clock.textContent = lang === 'ar' ? time.displayAr : time.displayEn;
            }
        }
        document.getElementById('loginForm').onsubmit = (e) => {
            if (window.AuthEngine) window.AuthEngine.handleLogin(e);
            else alert("جاري تحميل النظام، حاول مرة أخرى");
        };
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('lang') || 'ar';
            applyLanguage(savedLang);
            updateClock();
            setInterval(updateClock, 1000);
            if (window.AuthEngine) window.AuthEngine.enforceGuard();
        });
    </script>
</body>
</html>
