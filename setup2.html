<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Admin Setup</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBHHGY_gVpm3NlXThqsC6ojTL9Je4xQ9w",
            authDomain: "car-moving-8b59e.firebaseapp.com",
            databaseURL: "https://car-moving-8b59e-default-rtdb.firebaseio.com",
            projectId: "car-moving-8b59e",
            storageBucket: "car-moving-8b59e.firebasestorage.app",
            messagingSenderId: "332747318494",
            appId: "1:332747318494:web:d5d61cd53f322a182f0e4f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_EMAIL = "saad323m@gmail.com";
        const ADMIN_PASSWORD = "Admin@123456";   // تأكد من صحتها
        const ADMIN_USERNAME = "Saad Admin";
        const ADMIN_PHONE = "0500000000";        // غيّر لرقم حقيقي

        const log = (msg) => {
            const el = document.getElementById('log');
            el.innerText += msg + "\n";
            el.scrollTop = el.scrollHeight;
        };

        window.runUltimateSetup = async function() {
            document.getElementById('log').innerText = "";
            try {
                log("⏳ تسجيل الدخول...");
                const userCred = await signInWithEmailAndPassword(auth, ADMIN_EMAIL, ADMIN_PASSWORD);
                const actualUid = userCred.user.uid;
                log("✅ UID الحقيقي: " + actualUid);

                const userDocRef = doc(db, "users", actualUid);
                const userData = {
                    email: ADMIN_EMAIL,
                    username: ADMIN_USERNAME,
                    phone: ADMIN_PHONE,
                    role: "admin",
                    status: "active",
                    createdBy: actualUid,
                    createdAt: new Date()
                };

                // تحقق مما إذا كانت الوثيقة موجودة
                log("🔍 جاري فحص وثيقة المستخدم...");
                const existingSnap = await getDoc(userDocRef);
                
                if (existingSnap.exists()) {
                    log("⚠️ الوثيقة موجودة مسبقاً، سيتم تحديثها...");
                    await updateDoc(userDocRef, userData);
                    log("✅ تم تحديث وثيقة Firestore بنجاح.");
                } else {
                    log("📝 إنشاء وثيقة جديدة...");
                    await setDoc(userDocRef, userData);
                    log("✅ تم إنشاء وثيقة Firestore بنجاح.");
                }

                // تأكيد أخير
                const checkSnap = await getDoc(userDocRef);
                if (checkSnap.exists()) {
                    const data = checkSnap.data();
                    log("🔍 التأكيد النهائي - البيانات:");
                    log("    email: " + data.email);
                    log("    username: " + data.username);
                    log("    role: " + data.role);
                    log("    status: " + data.status);
                    log("    phone: " + data.phone);
                    log("🎉 كل شيء جاهز! افتح index.html وسجل الدخول.");
                } else {
                    log("❌ فشل التأكيد: الوثيقة غير موجودة بعد العملية.");
                }
            } catch (error) {
                log("❌ خطأ: " + error.message);
                if (error.code === "permission-denied") {
                    log("🚫 ما زالت قواعد Firestore تمنع الكتابة. تأكد أن القواعد هي: allow read, write: if true;");
                } else if (error.code === "auth/invalid-credential") {
                    log("🔑 كلمة المرور غير صحيحة.");
                }
            }
        };
    </script>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #f0f7ff; text-align: center;">
    <h1>⚙️ إعداد المدير - التشخيصي</h1>
    <p>1. أضف نطاق GitHub Pages إلى Authorized domains في Authentication.<br>2. تأكد من قواعد Firestore = allow read, write: if true;<br>3. اضغط الزر.</p>
    <button onclick="runUltimateSetup()" style="padding: 15px 30px; font-size: 18px; background: #1e3c72; color: white; border: none; border-radius: 8px;">تشغيل الإعداد الشامل</button>
    <pre id="log" style="background: white; padding: 20px; margin-top: 20px; text-align: left; border-radius: 8px; border: 1px solid #b8d8fc; white-space: pre-wrap; min-height: 300px;"></pre>
</body>
</html>
