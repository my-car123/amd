<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">نظام إدارة الأسطول والسائقين - تسجيل الدخول</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <header class="system-header">
        <div class="header-container">
            <div class="logo-wrapper">
                <img src="logo.png" alt="System Logo" class="main-logo">
            </div>
            <div class="header-right-side">
                <div class="clock-box">
                    <svg class="icon-svg icon-navy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <div id="uaeClock" class="system-clock">جاري تحميل وقت الإمارات...</div>
                </div>
                <button id="langSwitcher" class="btn-lang" onclick="toggleLanguage()">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9-9c1.657 0 3 4.03 3 9s-1.343 9-3 9m0-18c-1.657 0-3 4.03-3 9s1.343 9 3 9m-9-9a9 9 0 0 1 9-9"></path>
                    </svg>
                    <span id="langText">English</span>
                </button>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 id="loginTitle" class="auth-title">بوابة إدارة الأسطول والمشرفين</h2>
            
            <div id="errorContainer" class="error-container hidden">
                <p id="errorMessageText"></p>
            </div>

            <form id="loginForm" onsubmit="window.systemAuthEngine.handleSystemLogin(event)" novalidate>
                <div class="form-group">
                    <label id="lblEmail" for="loginEmail">البريد الإلكتروني للمشرف *</label>
                    <input type="email" id="loginEmail" required placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label id="lblPassword" for="loginPassword">كلمة المرور الحازمة *</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" id="btnSubmitLogin" class="btn-submit-navy">تسجيل الدخول الآمن</button>
            </form>
        </div>
    </div>

    <footer class="system-footer">
        <div class="footer-content">
            <span class="developer-credits">mohamed saad</span>
        </div>
    </footer>

    <script type="module" src="js/firebase-config.js"></script>
    <script src="js/logger.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // ============================================================
        // وظائف اللغة والساعة (منفصلة عن باقي الملفات)
        // ============================================================
        const dictionary = {
            ar: {
                pageTitle: "نظام إدارة الأسطول والسائقين - تسجيل الدخول",
                loginTitle: "بوابة إدارة الأسطول والمشرفين",
                lblEmail: "البريد الإلكتروني للمشرف *",
                lblPassword: "كلمة المرور الحازمة *",
                btnSubmitLogin: "تسجيل الدخول الآمن",
                langText: "English"
            },
            en: {
                pageTitle: "Fleet Management System - Portal Login",
                loginTitle: "Supervisor Fleet Portal Access",
                lblEmail: "Supervisor Email Address *",
                lblPassword: "Secure Password *",
                btnSubmitLogin: "Authorize & Login",
                langText: "العربية"
            }
        };

        function applyLanguage(lang) {
            const htmlTag = document.documentElement;
            htmlTag.setAttribute('lang', lang);
            htmlTag.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            
            for (let id in dictionary[lang]) {
                const el = document.getElementById(id);
                if (el) el.textContent = dictionary[lang][id];
            }
        }

        function initLanguage() {
            let currentLang = localStorage.getItem('sys_lang') || 'ar';
            applyLanguage(currentLang);
        }

        window.toggleLanguage = function() {
            let targetLang = localStorage.getItem('sys_lang') === 'ar' ? 'en' : 'ar';
            localStorage.setItem('sys_lang', targetLang);
            applyLanguage(targetLang);
            updateClock();
        };

        function updateClock() {
            const clockElement = document.getElementById('uaeClock');
            if (!clockElement) return;

            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const uaeTime = new Date(utc + (3600000 * 4));

            const daysArabic = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            const daysEnglish = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const monthsArabic = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
            const monthsEnglish = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

            const currentLang = localStorage.getItem('sys_lang') || 'ar';
            const dayName = currentLang === 'ar' ? daysArabic[uaeTime.getDay()] : daysEnglish[uaeTime.getDay()];
            const dayNum = uaeTime.getDate();
            const monthName = currentLang === 'ar' ? monthsArabic[uaeTime.getMonth()] : monthsEnglish[uaeTime.getMonth()];
            const yearNum = uaeTime.getFullYear();
            
            let hours = uaeTime.getHours();
            const minutes = uaeTime.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? (currentLang === 'ar' ? 'مساءً' : 'PM') : (currentLang === 'ar' ? 'صباحاً' : 'AM');
            
            hours = hours % 12;
            hours = hours ? hours : 12;
            const hoursStr = hours.toString().padStart(2, '0');

            let clockText = currentLang === 'ar' 
                ? `${dayName} ${dayNum} ${monthName} ${yearNum} الساعة ${hoursStr}:${minutes} ${ampm}`
                : `${dayName}, ${monthName} ${dayNum}, ${yearNum} - ${hoursStr}:${minutes} ${ampm}`;
            
            clockElement.textContent = clockText;
        }

        window.addEventListener('DOMContentLoaded', () => {
            initLanguage();
            updateClock();
            setInterval(updateClock, 1000);
            if (window.systemAuthEngine) {
                window.systemAuthEngine.enforceSystemRouteGuard();
            }
        });
    </script>
</body>
</html>
