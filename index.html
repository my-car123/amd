<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة السيارات والسائقين</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-800">تسجيل الدخول</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-2 mb-4 border rounded">
        <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-2 mb-6 border rounded">
        <button id="loginBtn" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">دخول</button>
        <p id="msg" class="mt-4 text-center text-red-500"></p>
    </div>

    <script type="module">
        import { loginUser } from './js/auth/login.js';

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');

            const result = await loginUser(email, password);
            if (result.success) {
                window.location.href = 'dashboard.html';
            } else {
                msg.textContent = result.message;
            }
        });
    </script>
</body>
</html>
