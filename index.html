<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Management - Login</title>
    <style>
        /* تصميم صفحة الدخول */
        :root { --primary: #3b82f6; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-card h2 { color: var(--primary); margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        button:hover { background: #2563eb; }
        #errMsg { color: red; margin-bottom: 10px; font-size: 0.9rem; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول</h2>
        <div id="errMsg"></div>
        <form id="loginForm">
            <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit">دخول</button>
        </form>
    </div>

    <!-- Firebase SDKs (طريقة قياسية مستقرة) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        // 1. إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDBHHGY_gVpm3NlXThqsC6ojTL9Je4xQ9w",
            authDomain: "car-moving-8b59e.firebaseapp.com",
            databaseURL: "https://car-moving-8b59e-default-rtdb.firebaseio.com",
            projectId: "car-moving-8b59e",
            storageBucket: "car-moving-8b59e.firebasestorage.app",
            messagingSenderId: "332747318494",
            appId: "1:332747318494:web:d5d61cd53f322a182f0e4f"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // 2. معالجة تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errBox = document.getElementById('errMsg');
            errBox.style.display = 'none';

            try {
                // محاولة تسجيل الدخول
                await auth.signInWithEmailAndPassword(email, pass);
                // التحقق من الصلاحيات
                const uid = auth.currentUser.uid;
                const snap = await db.ref(`system_users/${uid}`).get();
                
                if (snap.exists()) {
                    const role = snap.val().role;
                    localStorage.setItem('user_role', role);
                    window.location.href = "dashboard.html";
                } else {
                    // حالة المدير الرئيسي إذا لم يكن له سجل في DB
                    if(email === "saad323m@gmail.com") {
                        await db.ref(`system_users/${uid}`).set({ email: email, role: "admin", status: "active" });
                        localStorage.setItem('user_role', 'admin');
                        window.location.href = "dashboard.html";
                    } else {
                        errBox.textContent = "حسابك غير مفعل في النظام.";
                        errBox.style.display = 'block';
                        auth.signOut();
                    }
                }
            } catch (error) {
                // معالجة الأخطاء
                console.error(error);
                if (error.code === 'auth/user-not-found') {
                    // إذا المدير الرئيسي ولا يوجد حساب
                    if(email === "saad323m@gmail.com") {
                         try {
                            await auth.createUserWithEmailAndPassword(email, pass);
                            // إعادة تشغيل الدخول لإنشاء السجل
                            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                         } catch (e) { errBox.textContent = e.message; errBox.style.display = 'block'; }
                    } else {
                        errBox.textContent = "المستخدم غير موجود.";
                        errBox.style.display = 'block';
                    }
                } else {
                    errBox.textContent = "خطأ في كلمة المرور أو البريد.";
                    errBox.style.display = 'block';
                }
            }
        });

        // توجيه إذا كان مسجل دخوله بالفعل
        auth.onAuthStateChanged(user => {
            if(user) window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
