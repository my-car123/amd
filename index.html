<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetSys - نظام إدارة الأسطول</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-section" class="login-container">
        <div class="login-box">
            <img src="logo.png" alt="Logo" class="logo-login">
            <h2>تسجيل الدخول</h2>
            <form id="login-form">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
                <input type="password" id="password" placeholder="كلمة المرور" required>
                <button type="submit" class="btn-primary">دخول</button>
                <p id="login-error" class="error-msg"></p>
            </form>
        </div>
    </div>

    <!-- واجهة النظام الرئيسية -->
    <div id="app-section" class="app-wrapper" style="display: none;">
        
        <header>
            <img src="logo.png" alt="Logo" class="logo">
            <nav class="main-nav">
                <a href="#" class="nav-item active"><i class="fas fa-car"></i> السيارات</a>
                <a href="#" class="nav-item"><i class="fas fa-id-card"></i> السائقون</a>
                <a href="#" class="nav-item admin-only"><i class="fas fa-users-cog"></i> المشرفون</a>
                <a href="#" class="nav-item admin-only"><i class="fas fa-history"></i> السجل العام</a>
            </nav>
            <div class="user-info">
                <span id="user-display-name">SAAD</span> | <span id="user-role">مدير النظام</span>
                <button id="logout-btn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> خروج</button>
            </div>
        </header>

        <main id="app-container">
            <div class="top-actions">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="بحث برقم السيارة، القاعدة، أو المالك...">
                    <button class="btn-primary"><i class="fas fa-search"></i></button>
                </div>
                <button id="add-car-btn" class="btn-success"><i class="fas fa-plus"></i> إضافة سيارة</button>
            </div>

            <div id="cards-container" class="cards-grid"></div>
            <button id="load-more-btn" class="btn-load-more" style="display: none;">عرض المزيد</button>
        </main>

        <footer>
            <p>جميع الحقوق محفوظة &copy; FleetSys 2024</p>
        </footer>
    </div>

    <!-- نافذة إضافة/تعديل السيارة (Modal) -->
    <div id="car-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">إضافة سيارة جديدة</h2>
                <span class="close-btn">&times;</span>
            </div>
            <form id="car-form">
                <input type="hidden" id="car-id-hidden">
                <div class="form-row">
                    <div class="form-group">
                        <label>رقم اللوحة *</label>
                        <input type="text" id="plate-number" required>
                    </div>
                    <div class="form-group">
                        <label>الرمز *</label>
                        <input type="text" id="plate-code" required placeholder="مثال: 22 أو أ">
                    </div>
                </div>
                <div class="form-group">
                    <label>المالك *</label>
                    <input type="text" id="owner" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>النوع *</label>
                        <input type="text" id="car-type" required>
                    </div>
                    <div class="form-group">
                        <label>سنة الصنع *</label>
                        <input type="number" id="car-year" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>رقم القاعدة (VIN) *</label>
                    <input type="text" id="vin" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>تاريخ انتهاء الترخيص *</label>
                        <input type="date" id="license-expiry" required>
                    </div>
                    <div class="form-group">
                        <label>تاريخ انتهاء التأمين *</label>
                        <input type="date" id="insurance-expiry" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>ملاحظات</label>
                    <textarea id="notes"></textarea>
                </div>
                <div class="form-group">
                    <label>تدوين المخالفات</label>
                    <textarea id="violations"></textarea>
                </div>
                <button type="submit" class="btn-primary btn-block">حفظ البيانات</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
