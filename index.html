<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام الإدارة المتكامل</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <section id="loginSection" class="login-container">
            <div class="login-card">
                <h2>تسجيل الدخول</h2>
                <input type="email" id="email" placeholder="البريد الإلكتروني">
                <input type="password" id="pass" placeholder="كلمة المرور">
                <button id="loginBtn">دخول</button>
            </div>
        </section>

        <section id="dashboardSection" class="hidden">
            <nav class="navbar">
                <div class="brand">نظام الإدارة</div>
                <div class="menu">
                    <button id="logoutBtn">تسجيل خروج</button>
                </div>
            </nav>
            <main class="content">
                <div id="usersList"></div>
                <button id="loadMoreBtn" class="btn-more">عرض المزيد</button>
            </main>
        </section>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
