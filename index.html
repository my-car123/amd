<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetSys - نظام إدارة الأسطول</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-section" class="login-container">
        <div class="login-box">
            <img src="logo.png" alt="Logo" class="logo-login">
            <h2>تسجيل الدخول</h2>
            <form id="login-form">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
                <input type="password" id="password" placeholder="كلمة المرور" required>
                <button type="submit" class="btn-primary">دخول</button>
                <p id="login-error" class="error-msg"></p>
            </form>
        </div>
    </div>

    <!-- واجهة النظام الرئيسية (مخفية افتراضياً) -->
    <div id="app-section" class="app-wrapper" style="display: none;">
        
        <!-- Header & Nav -->
        <header>
            <img src="logo.png" alt="Logo" class="logo">
            <nav class="main-nav">
                <a href="#" class="nav-item active"><i class="fas fa-car"></i> السيارات</a>
                <a href="#" class="nav-item"><i class="fas fa-id-card"></i> السائقون</a>
                <a href="#" class="nav-item admin-only"><i class="fas fa-users-cog"></i> المشرفون</a>
                <a href="#" class="nav-item admin-only"><i class="fas fa-history"></i> السجل العام</a>
            </nav>
            <div class="user-info">
                <span id="user-display-name">SAAD</span> | <span id="user-role">مدير النظام</span>
                <button id="logout-btn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> خروج</button>
            </div>
        </header>

        <!-- Main Content -->
        <main id="app-container">
            <div class="search-bar">
                <input type="text" placeholder="بحث برقم السيارة، القاعدة، أو المالك...">
                <button class="btn-primary"><i class="fas fa-search"></i></button>
            </div>

            <!-- هنا سيتم عرض البطاقات -->
            <div id="cards-container" class="cards-grid">
                <!-- سيتم إنشاء البطاقات برمجياً -->
            </div>
            
            <button id="load-more-btn" class="btn-load-more" style="display: none;">عرض المزيد</button>
        </main>

        <footer>
            <p>جميع الحقوق محفوظة &copy; FleetSys 2024</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
