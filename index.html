<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Login Section -->
    <div id="loginSection" class="login-container">
      <div class="login-card">
        <img src="logo.png" alt="Logo" class="logo" id="loginLogo">
        <h2>Member Login</h2>
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        <button id="loginBtn">Sign In</button>
        <div id="loginError" class="error"></div>
      </div>
    </div>

    <!-- Dashboard Section (hidden by default) -->
    <div id="dashboardSection" class="dashboard hidden">
      <div class="sidebar">
        <img src="logo.png" alt="Logo" class="logo-small">
        <nav id="sidebarNav"></nav>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </div>
      <div class="main-panel" id="mainPanel"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
