<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Setup (Complete)</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBHHGY_gVpm3NlXThqsC6ojTL9Je4xQ9w",
            authDomain: "car-moving-8b59e.firebaseapp.com",
            databaseURL: "https://car-moving-8b59e-default-rtdb.firebaseio.com",
            projectId: "car-moving-8b59e",
            storageBucket: "car-moving-8b59e.firebasestorage.app",
            messagingSenderId: "332747318494",
            appId: "1:332747318494:web:d5d61cd53f322a182f0e4f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // بيانات المدير (عدّل كلمة المرور ورقم الهاتف فقط إن أردت)
        const ADMIN_EMAIL = "saad323m@gmail.com";
        const ADMIN_PASSWORD = "2020@2020@80";   // غيّرها إلى كلمة مرور قوية
        const ADMIN_UID = "ZUIkgUJOA1ObyKYEgul3GCjQKRA2";
        const ADMIN_USERNAME = "MOHAMED SAAD";
        const ADMIN_PHONE = "0505965099";        // غيّر إلى رقم حقيقي

        const log = (msg) => {
            document.getElementById('log').innerText += msg + "\n";
        };

        window.runSetup = async function() {
            document.getElementById('log').innerText = "";
            try {
                log("⏳ بدء الإعداد...");

                // الخطوة 1: إنشاء المستخدم في Authentication
                let uidToUse = ADMIN_UID;
                try {
                    const userCred = await createUserWithEmailAndPassword(auth, ADMIN_EMAIL, ADMIN_PASSWORD);
                    log("✅ تم إنشاء حساب المصادقة بنجاح.");
                    uidToUse = userCred.user.uid; // استخدام UID الحقيقي من Auth
                    log("📌 UID من المصادقة: " + uidToUse);
                } catch (authError) {
                    if (authError.code === "auth/email-already-in-use") {
                        log("⚠️ الحساب موجود مسبقًا في المصادقة، نستخدم UID المدخل: " + ADMIN_UID);
                        // نتأكد من صحة كلمة المرور بتجربة الدخول
                        await signInWithEmailAndPassword(auth, ADMIN_EMAIL, ADMIN_PASSWORD);
                        log("✅ كلمة المرور صحيحة.");
                        uidToUse = ADMIN_UID;
                    } else {
                        throw authError;
                    }
                }

                // الخطوة 2: إنشاء وثيقة Firestore في مجموعة users
                log("📝 جاري إنشاء وثيقة Firestore...");
                const userData = {
                    email: ADMIN_EMAIL,
                    username: ADMIN_USERNAME,
                    phone: ADMIN_PHONE,
                    role: "admin",
                    status: "active",
                    createdBy: uidToUse,
                    createdAt: new Date()
                };
                await setDoc(doc(db, "users", uidToUse), userData);
                log("✅ تم إنشاء وثيقة المستخدم في Firestore بنجاح.");
                log("🎉 جاهز! يمكنك الآن تسجيل الدخول إلى index.html بالبيانات أعلاه.");
            } catch (error) {
                log("❌ خطأ: " + error.message);
                if (error.code === "permission-denied") {
                    log("🚫 السبب: قواعد Firestore تمنع الكتابة. تأكد من تعديل القواعد كما هو موضح في التعليمات.");
                }
            }
        };
    </script>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #f0f7ff; text-align: center;">
    <h1>⚙️ إعداد المدير - شامل</h1>
    <p>تأكد من تعديل قواعد Firestore (الخطوة 1 في الشرح) ثم اضغط الزر أدناه.</p>
    <button onclick="runSetup()" style="padding: 15px 30px; font-size: 18px; background: #1e3c72; color: white; border: none; border-radius: 8px;">تشغيل الإعداد</button>
    <pre id="log" style="background: white; padding: 20px; margin-top: 20px; text-align: left; border-radius: 8px; border: 1px solid #b8d8fc; white-space: pre-wrap; min-height: 200px;"></pre>
</body>
</html>
