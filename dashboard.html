<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="system-header">
        <div class="header-container">
            <div class="logo-wrapper">
                <img src="logo.png" alt="Logo" class="main-logo">
            </div>
            <div class="header-right-side">
                <div class="clock-box" id="uaeClock">--:--</div>
                <button class="btn-lang" onclick="toggleLanguage()">
                    <span id="langText">English</span>
                </button>
                <button class="btn-action btn-danger" onclick="window.firebaseAuth.signOut(); window.location.href='index.html';" data-trans="logout">خروج</button>
            </div>
        </div>
    </header>

    <nav class="main-nav-bar">
        <div class="nav-container">
            <button class="tab-btn active" onclick="switchTab('stats')" data-trans="tabStats">الإحصائيات</button>
            <button class="tab-btn" onclick="switchTab('vehicles')" data-trans="tabVehicles">المركبات</button>
            <button class="tab-btn" onclick="switchTab('drivers')" data-trans="tabDrivers">السائقين</button>
            <!-- أزرار المدير فقط -->
            <button class="tab-btn admin-only" onclick="switchTab('users')" data-trans="tabUsers">المستخدمين</button>
            <button class="tab-btn admin-only" onclick="switchTab('logs')" data-trans="tabLogs">السجلات</button>
        </div>
    </nav>

    <main class="main-content-area">

        <!-- 1. قسم الإحصائيات -->
        <section id="panel-stats" class="tab-panel active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info">
                        <h3 data-trans="totalVehicles">إجمالي المركبات</h3>
                        <p class="stat-value" id="statVehicles">0</p>
                    </div>
                </div>
                <div class="stat-card success">
                    <div class="stat-info">
                        <h3 data-trans="totalDrivers">إجمالي السائقين</h3>
                        <p class="stat-value" id="statDrivers">0</p>
                    </div>
                </div>
                <div class="stat-card danger">
                    <div class="stat-info">
                        <h3 data-trans="expiredDocs">مستندات منتهية</h3>
                        <p class="stat-value" id="statExpired">0</p>
                    </div>
                </div>
                <div class="stat-card warning">
                    <div class="stat-info">
                        <h3 data-trans="expiringSoon">على وشك الانتهاء</h3>
                        <p class="stat-value" id="statWarning">0</p>
                    </div>
                </div>
            </div>
            
            <!-- رسم بياني بسيط أو قائمة تنبيهات يمكن إضافتها هنا -->
            <div class="dashboard-chart-container">
                <h3>Recent Activity / Alerts</h3>
                <div id="alertsList" class="data-list-container"></div>
            </div>
        </section>

        <!-- 2. قسم المركبات -->
        <section id="panel-vehicles" class="tab-panel">
            <div class="action-toolbar">
                <input type="text" id="searchVehicles" class="search-input" placeholder="Search by Plate / VIN..." onkeyup="loadVehicles(this.value)">
                <button class="btn-action btn-primary" onclick="openAddVehicleModal()" data-trans="addNew">إضافة مركبة</button>
            </div>

            <div id="vehiclesList" class="data-list-container">
                <!-- كروت المركبات ستظهر هنا -->
            </div>

            <div class="load-more-wrapper">
                <button id="loadMoreVehicles" class="btn-action btn-outline" onclick="loadVehicles(null, true)" data-trans="loadMore">تحميل المزيد</button>
            </div>
        </section>

        <!-- 3. قسم السائقين -->
        <section id="panel-drivers" class="tab-panel">
            <div class="action-toolbar">
                <input type="text" class="search-input" placeholder="Search Driver Name...">
                <button class="btn-action btn-primary" onclick="openAddDriverModal()" data-trans="addNew">إضافة سائق</button>
            </div>

            <div id="driversList" class="data-list-container">
                <!-- كروت السائقين ستظهر هنا -->
            </div>
            
            <div class="load-more-wrapper">
                <button id="loadMoreDrivers" class="btn-action btn-outline" data-trans="loadMore">تحميل المزيد</button>
            </div>
        </section>

        <!-- 4. قسم المستخدمين (Admin Only) -->
        <section id="panel-users" class="tab-panel admin-only">
            <div class="action-toolbar">
                <button class="btn-action btn-primary" onclick="openAddUserModal()">إضافة مشرف جديد</button>
            </div>
            <div id="usersList" class="data-list-container"></div>
        </section>

        <!-- 5. قسم السجلات (Admin Only) -->
        <section id="panel-logs" class="tab-panel admin-only">
            <div class="action-toolbar">
                <button class="btn-action btn-outline" onclick="window.print()"><span data-trans="print">طباعة</span></button>
            </div>
            <div id="logsList" class="data-list-container"></div>
        </section>

    </main>

    <!-- حاوية النوافذ المنبثقة (Modals) -->
    <div id="modalContainer"></div>

    <footer class="system-footer">
        <div class="footer-content">
            <span class="developer-credits">© 2024 Fleet Management System - Mohamed Saad</span>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script src="js/logger.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>

    <script>
        // تشغيل حماية الصفحة عند التحميل
        window.addEventListener('DOMContentLoaded', () => {
           if(window.authEngine) window.authEngine.enforceRouteGuard();
        });
    </script>
</body>
</html>
