<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card" style="max-width: 600px; margin: auto;">
        <h1>Admin Dashboard</h1>
        <p>UAE Time: <span id="time"></span></p>
        <hr>
        <!-- Member Card Example -->
        <div class="accordion">
            <div class="accordion-header" onclick="toggle(this)">
                <span>User: Mohammed</span>
                <span>Role: Admin | Status: Active</span>
            </div>
            <div class="accordion-content">
                <p><strong>Name:</strong> Mohammed Saad</p>
                <p><strong>Role:</strong> Admin</p>
                <p><strong>Custodian Status:</strong> Active</p>
                <p><strong>Phone:</strong> 0500000000</p>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('time').innerText = new Date().toLocaleString("en-US", {timeZone: "Asia/Dubai"});
        function toggle(el) {
            let content = el.nextElementSibling;
            content.style.display = content.style.display === "block" ? "none" : "block";
        }
    </script>
</body>
</html>
