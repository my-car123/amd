<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Dashboard</h1>
            <p>UAE Time: <span id="time"></span></p>
        </div>
        <div id="adminPanel" class="card" style="display:none;">
            <h3>Add/Manage Members</h3>
            <input type="text" id="mName" placeholder="Full Name">
            <input type="text" id="mPhone" placeholder="Phone (Starts with 0, 10 digits)">
            <select id="mRole"><option value="user">User</option><option value="moderator">Moderator</option></select>
            <button id="addMemberBtn">Add New Member</button>
        </div>
        <div id="membersList"></div>
    </div>
    <script type="module" src="admin.js"></script>
    <script> document.getElementById('time').innerText = new Date().toLocaleString("en-US", {timeZone: "Asia/Dubai"}); </script>
</body>
</html>
