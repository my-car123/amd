<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="dashPageTitle">نظام إدارة الأسطول - لوحة التحكم</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .nav-tabs-container { max-width: 1400px; margin: 20px auto 0 auto; padding: 0 24px; display: flex; gap: 10px; border-bottom: 2px solid var(--navy-primary); }
        .tab-btn { background-color: var(--bg-light); color: var(--navy-light); border: 2px solid var(--navy-light); border-bottom: none; padding: 10px 20px; font-weight: bold; font-size: 0.95rem; cursor: pointer; border-radius: 6px 6px 0 0; display: flex; align-items: center; gap: 8px; transition: var(--transition-fast); }
        .tab-btn.active { background-color: var(--navy-primary); color: var(--pure-white); border-color: var(--navy-primary); }
        .main-dashboard-content { max-width: 1400px; margin: 0 auto; padding: 24px; flex: 1; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background-color: var(--pure-white); border: 2px solid var(--navy-primary); border-radius: 6px; padding: 20px; display: flex; align-items: center; justify-content: space-between; }
        .stat-info h3 { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px; }
        .stat-info p { font-size: 1.8rem; font-weight: 800; color: var(--navy-primary); }
        .search-filter-box { background-color: var(--bg-light); border: 1.5px solid var(--navy-light); border-radius: 4px; padding: 20px; margin-bottom: 25px; }
        .search-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .cards-list-wrapper { display: flex; flex-direction: column; gap: 15px; }
        .action-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; }
        .btn-add-action { background-color: var(--navy-primary); color: var(--pure-white); border: 2px solid var(--navy-primary); padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        @media (max-width: 768px) { .nav-tabs-container { flex-direction: column; border-bottom: none; padding: 0 16px; } .tab-btn { border-radius: 4px; border-bottom: 2px solid var(--navy-light); } .action-header-bar { flex-direction: column; align-items: flex-start; } .btn-add-action { width: 100%; justify-content: center; } }
    </style>
</head>
<body>

    <header class="system-header">
        <div class="header-container">
            <div class="logo-wrapper">
                <img src="logo.png" alt="System Logo" class="main-logo">
            </div>
            <div class="header-right-side">
                <div class="clock-box">
                    <svg class="icon-svg icon-navy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <div id="uaeClock" class="system-clock">جاري تحميل الوقت...</div>
                </div>
                <button id="langSwitcher" class="btn-lang" onclick="toggleDashboardLanguage()">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9-9c1.657 0 3 4.03 3 9s-1.343 9-3 9m0-18c-1.657 0-3 4.03-3 9s1.343 9 3 9m-9-9a9 9 0 0 1 9-9"></path>
                    </svg>
                    <span id="langText">English</span>
                </button>
            </div>
        </div>
    </header>

    <nav class="nav-tabs-container">
        <button class="tab-btn active" onclick="switchDashboardTab('overview')">
            <span id="tabTextOverview">الإحصائيات والتنبيهات</span>
        </button>
        <button class="tab-btn" onclick="switchDashboardTab('vehicles')">
            <span id="tabTextVehicles">أسطول السيارات</span>
        </button>
        <button class="tab-btn" onclick="switchDashboardTab('drivers')">
            <span id="tabTextDrivers">قائمة السائقين</span>
        </button>
    </nav>

    <main class="main-dashboard-content">

        <section id="panelOverview" class="tab-panel active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info">
                        <h3 id="statLblTotalVehicles">إجمالي السيارات</h3>
                        <p id="statValTotalVehicles">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <h3 id="statLblValid">مركبات صالحة</h3>
                        <p id="statValValid" style="color: var(--alert-success);">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <h3 id="statLblExpiring">قريبة من الانتهاء</h3>
                        <p id="statValExpiring" style="color: var(--alert-warning);">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <h3 id="statLblExpired">منتهية الصلاحية</h3>
                        <p id="statValExpired" style="color: var(--alert-danger);">0</p>
                    </div>
                </div>
            </div>

            <div class="action-header-bar">
                <h2 id="titleCriticalAlerts">السيارات التي تحتاج انتباه عاجل (تأمين / ترخيص)</h2>
            </div>
            <div id="criticalVehiclesList" class="cards-list-wrapper"></div>
        </section>

        <section id="panelVehicles" class="tab-panel">
            <div class="action-header-bar">
                <h2 id="titleVehiclesList">سجلات أسطول المركبات العام</h2>
                <button class="btn-add-action" onclick="openAddVehicleModal()">
                    <span id="btnAddVehicle">إضافة سيارة جديدة</span>
                </button>
            </div>
            <div id="generalVehiclesList" class="cards-list-wrapper"></div>
        </section>

        <section id="panelDrivers" class="tab-panel">
            <div class="action-header-bar">
                <h2 id="titleDriversList">سجلات السائقين بالمنظومة</h2>
                <button class="btn-add-action" onclick="openAddDriverModal()">
                    <span id="btnAddDriver">إضافة سائق جديد</span>
                </button>
            </div>
            <div id="generalDriversList" class="cards-list-wrapper"></div>
        </section>

    </main>

    <footer class="system-footer">
        <div class="footer-content">
            <span class="developer-credits">mohamed saad</span>
        </div>
    </footer>

    <script type="module" src="js/firebase-config.js"></script>
    <script src="js/logger.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.systemAuthEngine) window.systemAuthEngine.enforceSystemRouteGuard();
        });

        const dashDictionary = {
            ar: {
                dashPageTitle: "نظام إدارة الأسطول - لوحة التحكم",
                tabTextOverview: "الإحصائيات والتنبيهات",
                tabTextVehicles: "أسطول السيارات",
                tabTextDrivers: "قائمة السائقين",
                statLblTotalVehicles: "إجمالي السيارات",
                statLblValid: "مركبات صالحة",
                statLblExpiring: "قريبة من الانتهاء",
                statLblExpired: "منتهية الصلاحية",
                titleCriticalAlerts: "السيارات التي تحتاج انتباه عاجل (تأمين / ترخيص)",
                titleVehiclesList: "سجلات أسطول المركبات العام",
                btnAddVehicle: "إضافة سيارة جديدة",
                titleDriversList: "سجلات السائقين بالمنظومة",
                btnAddDriver: "إضافة سائق جديد",
                langText: "English"
            },
            en: {
                dashPageTitle: "Fleet Management - Dashboard",
                tabTextOverview: "Stats & Alerts",
                tabTextVehicles: "Fleet Inventory",
                tabTextDrivers: "Drivers List",
                statLblTotalVehicles: "Total Fleet",
                statLblValid: "Valid Status",
                statLblExpiring: "Expiring Soon",
                statLblExpired: "Expired Status",
                titleCriticalAlerts: "Vehicles Requiring Urgent Attention",
                titleVehiclesList: "General Fleet Inventory Logs",
                btnAddVehicle: "Add New Vehicle",
                titleDriversList: "Drivers Database Logs",
                btnAddDriver: "Add New Driver",
                langText: "العربية"
            }
        };

        function initDashboardLanguage() {
            let currentLang = localStorage.getItem('sys_lang') || 'ar';
            applyDashboardLanguage(currentLang);
        }

        function toggleDashboardLanguage() {
            let targetLang = localStorage.getItem('sys_lang') === 'ar' ? 'en' : 'ar';
            localStorage.setItem('sys_lang', targetLang);
            applyDashboardLanguage(targetLang);
            updateDashboardClock();
            if (window.renderCurrentDashboardTab) window.renderCurrentDashboardTab();
        }

        function applyDashboardLanguage(lang) {
            const htmlTag = document.documentElement;
            htmlTag.setAttribute('lang', lang);
            htmlTag.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            for (let id in dashDictionary[lang]) {
                const el = document.getElementById(id);
                if (el) el.textContent = dashDictionary[lang][id];
            }
        }

        function switchDashboardTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            
            const event = window.event;
            if (event && event.currentTarget) event.currentTarget.classList.add('active');
            
            if (tabId === 'overview') document.getElementById('panelOverview').classList.add('active');
            if (tabId === 'vehicles') document.getElementById('panelVehicles').classList.add('active');
            if (tabId === 'drivers') document.getElementById('panelDrivers').classList.add('active');

            localStorage.setItem('active_dash_tab', tabId);
            if (window.onDashboardTabChanged) window.onDashboardTabChanged(tabId);
        }

        function updateDashboardClock() {
            const clockElement = document.getElementById('uaeClock');
            if (!clockElement) return;

            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const uaeTime = new Date(utc + (3600000 * 4));

            const daysArabic = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            const daysEnglish = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const monthsArabic = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
            const monthsEnglish = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

            const currentLang = localStorage.getItem('sys_lang') || 'ar';
            const dayName = currentLang === 'ar' ? daysArabic[uaeTime.getDay()] : daysEnglish[uaeTime.getDay()];
            const dayNum = uaeTime.getDate();
            const monthName = currentLang === 'ar' ? monthsArabic[uaeTime.getMonth()] : monthsEnglish[uaeTime.getMonth()];
            const yearNum = uaeTime.getFullYear();
            
            let hours = uaeTime.getHours();
            const minutes = uaeTime.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? (currentLang === 'ar' ? 'مساءً' : 'PM') : (currentLang === 'ar' ? 'صباحاً' : 'AM');
            
            hours = hours % 12;
            hours = hours ? hours : 12;
            const hoursStr = hours.toString().padStart(2, '0');

            let clockText = currentLang === 'ar' 
                ? `${dayName} ${dayNum} ${monthName} ${yearNum} الساعة ${hoursStr}:${minutes} ${ampm}`
                : `${dayName}, ${monthName} ${dayNum}, ${yearNum} - ${hoursStr}:${minutes} ${ampm}`;
            
            clockElement.textContent = clockText.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        }

        window.addEventListener('DOMContentLoaded', () => {
            initDashboardLanguage();
            updateDashboardClock();
            setInterval(updateDashboardClock, 1000);
            switchDashboardTab(localStorage.getItem('active_dash_tab') || 'overview');
        });
    </script>
</body>
</html>
